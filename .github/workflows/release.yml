name: Release

# Publishes the package to npm when a version tag (v0.1.0, v0.2.3...) is pushed.
# No npm token: authentication goes through trusted publishing (OIDC). The
# release lands in npm's stage queue and goes live only once a maintainer
# approves it with 2FA (npmjs.com, "Staged Packages" tab, or npm stage approve).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15 or later, Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # When npm refuses the OIDC exchange, it only says why at verbose level and
      # falls back to setup-node's placeholder token, which ends in a bare E401.
      - name: Stage the release on npm
        run: npm stage publish --loglevel verbose
